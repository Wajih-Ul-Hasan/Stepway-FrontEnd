<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#235e46">
<title>Choose a new password · Stepway</title>
<script src="js/config.js">
</script>
<script src="js/api-config.js">
</script>
<link rel="stylesheet" href="css/stepway.css">
</head>
<body class="sw">
<main class="auth">
<aside class="auth-story">
<a class="brand" href="frontPage.html" aria-label="Stepway home">
<span class="brand-mark" aria-hidden="true">↗</span>stepway<span style="color:#7e9560">.</span>
</a>
<div>
<p class="eyebrow">Account recovery</p>
<h1>Create a<br>strong new<br>password.</h1>
<p>Your reset link is single-use and expires automatically.</p>
</div>
<small>STEPWAY / ACCOUNT SECURITY</small>
</aside>
<section class="auth-main">
<div class="auth-form">
<p class="eyebrow">Password reset</p>
<h2>Choose a new password.</h2>
<p class="muted">Use at least 12 characters.</p>
<form id="account-form" data-mode="reset-password">
<div class="field">
<label for="password">New password</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="64" required>
</div>
<p id="account-message" class="form-message" role="alert">
</p>
<button id="account-submit" class="btn full" type="submit">Update password</button>
</form>
<p class="auth-bottom muted"><a href="index.html">Back to sign in</a>
</p>
</div>
</section>
</main>
<script src="js/account-recovery.js">
</script>
</body>
</html>
