<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#235e46">
<title>Reset password · Stepway</title>
<script src="js/config.js">
</script>
<script src="js/api-config.js">
</script>
<link rel="stylesheet" href="css/stepway.css">
</head>
<body class="sw">
<main class="auth">
<aside class="auth-story">
<a class="brand" href="frontPage.html" aria-label="Stepway home">
<span class="brand-mark" aria-hidden="true">↗</span>stepway<span style="color:#7e9560">.</span>
</a>
<div>
<p class="eyebrow">Account recovery</p>
<h1>Get back to<br>your learning<br>workspace.</h1>
<p>Stepway will send a secure reset link if the email belongs to an account.</p>
</div>
<small>STEPWAY / ACCOUNT SECURITY</small>
</aside>
<section class="auth-main">
<div class="auth-form">
<p class="eyebrow">Password reset</p>
<h2>Find your account.</h2>
<p class="muted">Enter the email you use for Stepway.</p>
<form id="account-form" data-mode="forgot-password">
<div class="field">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
</div>
<p id="account-message" class="form-message" role="alert">
</p>
<button id="account-submit" class="btn full" type="submit">Send reset link</button>
</form>
<p class="auth-bottom muted"><a href="index.html">Back to sign in</a>
</p>
</div>
</section>
</main>
<script src="js/account-recovery.js">
</script>
</body>
</html>
